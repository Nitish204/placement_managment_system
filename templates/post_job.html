{% extends "base.html" %}
{% block content %}
<div class="container mt-4 pt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-4 animate-fadeInUp">
                <div class="text-center mb-4">
                    <i class="fas fa-plus-circle fa-3x" style="color: var(--accent-2);"></i>
                    <h3 class="mt-2">Post a New Job</h3>
                    <p class="text-muted">Fill in the details below</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Job Title *</label>
                        <input type="text" name="title" class="form-control" required placeholder="e.g., Software Engineer Intern">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea name="description" class="form-control" rows="5" required placeholder="Job responsibilities, requirements, etc."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Required Skills (comma separated) *</label>
                        <input type="text" name="required_skills" class="form-control" required placeholder="Python, Java, SQL, React">
                        <small class="text-muted">These will be used for AI resume screening.</small>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" name="location" class="form-control" placeholder="Remote / City">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary Range</label>
                            <input type="text" name="salary_range" class="form-control" placeholder="e.g., 5-8 LPA">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Date to Apply</label>
                        <input type="date" name="last_date" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-gradient w-100">
                        <i class="fas fa-save"></i> Post Job
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
