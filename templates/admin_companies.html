{% extends "base.html" %}
{% block content %}
<div class="container" style="padding-top: 1.5rem; padding-bottom: 3rem;">
    <div class="glass-card p-4">
        <div class="page-header">
            <h3><i class="fas fa-building me-2"></i>All Companies</h3>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-gradient"><i class="fas fa-arrow-left"></i> Back</a>
        </div>
        <div class="table-responsive">
            <table class="table custom-table">
                <thead>
                    <tr><th>Company Name</th><th>Industry</th><th>Location</th><th>Website</th><th>Jobs Posted</th><th>Action</th></tr>
                </thead>
                <tbody>
                    {% for c in companies %}
                    <tr>
                        <td>{{ c.company_name }}</td>
                        <td>{{ c.industry }}</td>
                        <td>{{ c.location }}</td>
                        <td>{% if c.website %}<a href="{{ c.website }}" target="_blank">Link</a>{% else %}—{% endif %}</td>
                        <td>{{ c.jobs|length }}</td>
                        <td><a href="{{ url_for('delete_user', user_id=c.user_id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete company?')">Delete</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
