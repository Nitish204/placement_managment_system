<!-- templates/register_student.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-4 pt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-4 animate-fadeInUp">
                <div class="text-center mb-4">
                    <i class="fas fa-user-graduate fa-3x" style="color: #667eea;"></i>
                    <h3 class="mt-2">Student Registration</h3>
                    <p class="text-muted">Create your account to start applying</p>
                </div>
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" name="full_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password *</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Roll Number *</label>
                            <input type="text" name="roll_number" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Branch</label>
                            <select name="branch" class="form-select">
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Mechanical">Mechanical</option>
                                <option value="Civil">Civil</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">CGPA</label>
                            <input type="number" step="0.01" name="cgpa" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Passing Year</label>
                            <input type="number" name="passing_year" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" name="phone" class="form-control">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Skills (comma separated)</label>
                            <input type="text" name="skills" class="form-control" placeholder="Python, Java, SQL, React">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Already have an account? Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
