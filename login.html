<!-- templates/login.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 animate-fadeInUp">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x" style="color: #667eea;"></i>
                    <h3 class="mt-2">Welcome Back</h3>
                    <p class="text-muted">Login to your account</p>
                </div>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-key"></i> Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-0">New here? 
                        <a href="{{ url_for('register_student') }}" class="text-decoration-none">Register as Student</a> | 
                        <a href="{{ url_for('register_company') }}" class="text-decoration-none">Register as Company</a>
                    </p>
                    <small class="text-muted d-block mt-2">Demo Admin: admin@campus.com / admin123</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
